name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do not paste personal data (computer name, IP/MAC addresses, user names) or full Check-Up reports.
        Türkçe yazabilirsiniz.
  - type: input
    id: version
    attributes:
      label: Mantis version
      placeholder: "1.4.1 (shown at the bottom of the sidebar)"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and language
      placeholder: "Windows 11 24H2, Turkish"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Overview, Cleaner, Tools, Updates, Security Check-Up, Settings, Setup / uninstall, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
  - type: checkboxes
    id: mode
    attributes:
      label: Mode
      options:
        - label: Running as administrator
  - type: textarea
    id: log
    attributes:
      label: Crash log (optional)
      description: If Mantis crashed, paste the last lines of %LOCALAPPDATA%\ProjectMantis\crash.log
      render: text
