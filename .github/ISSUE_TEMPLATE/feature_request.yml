name: Feature request
description: Suggest a tool, check or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Mantis stays small, local and defensive: no background services, no telemetry, no remote scanning, and every change asks first.
        Türkçe yazabilirsiniz.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Mantis to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
