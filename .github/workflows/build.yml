# Project Mantis CI — https://github.com/kemalselimkoc/Project-Mantis
# Every push / pull request: build with the Windows .NET Framework compiler (no SDK) and run the self-test.
# A tag such as v1.4.0: also sign (once SignPath is configured, see SIGNING.md) and publish a GitHub Release
# with the Setup exe, the portable zip and their SHA-256 values.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Self-test
        shell: powershell
        run: |
          $exe = Get-ChildItem dist -Filter 'ProjectMantis-v*.exe' | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Upload unsigned exe
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: dist/ProjectMantis-v*.exe
          if-no-files-found: error

  # Inert until the repository variable SIGNPATH_ORGANIZATION_ID and secret SIGNPATH_API_TOKEN exist.
  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    steps:
      - name: Submit to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed exe
        uses: actions/upload-artifact@v4
        with:
          name: signed
          path: signed/*.exe
          if-no-files-found: error

  release:
    needs: [build, sign]
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') && needs.sign.result != 'failure'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches AppInfo version
        shell: powershell
        run: |
          $version = [regex]::Match((Get-Content AppInfo.cs -Raw), 'Version\s*=\s*"([^"]+)"').Groups[1].Value
          if ('${{ github.ref_name }}' -ne "v$version") { throw "Tag ${{ github.ref_name }} does not match AppInfo.cs version v$version" }

      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sign.result == 'success' && 'signed' || 'unsigned' }}
          path: dist

      - name: Package
        shell: powershell
        run: .\package-release.ps1

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.sign.result == 'success' }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = Get-ChildItem release -File | Where-Object { $_.Name -like 'ProjectMantis-Setup-*.exe' -or $_.Name -like '*-portable.zip' }
          $lines = $files | ForEach-Object { '| `' + $_.Name + '` | `' + (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '` |' }
          $note = if ($env:SIGNED -eq 'true') { 'The exe is code-signed.' } else { 'This build is not code-signed yet; Windows SmartScreen may warn. Compare the SHA-256 below before running.' }
          $body = "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$tag/CHANGELOG.md) for what changed.`n`n$note`n`n| File | SHA-256 |`n| --- | --- |`n" + ($lines -join "`n")
          [IO.File]::WriteAllText("$PWD\notes.md", $body, (New-Object Text.UTF8Encoding($false)))
          gh release create $tag $files.FullName --title "Project Mantis $tag" --notes-file notes.md
